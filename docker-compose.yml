services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: predictionos
      POSTGRES_PASSWORD: ${postgres_password}
      POSTGRES_DB: predictionos
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U predictionos"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context : .
      dockerfile : backend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://predictionos:${postgres_password}@db:5432/predictionos
      jwtsecret: ${jwtsecret}
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: